[project]
name = "hybrid-rag-hf-docs"
version = "1.0.0"
description = "Hybrid Search RAG over HuggingFace Transformers + PEFT docs — dense + BM25 + RRF + cross-encoder reranking, with verified citations and rigorous eval"
authors = [
    { name = "Ritesh Swami", email = "riteshswamiofficial@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["rag", "hybrid-search", "bm25", "dense-retrieval", "reranking", "nlp"]

dependencies = [
    # Vector store
    "chromadb>=0.6.0",
    # Sparse retrieval
    "rank-bm25>=0.2.2",
    # Embeddings and reranking
    "sentence-transformers>=3.3.0",
    # Text splitting
    "langchain-text-splitters>=0.3.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Data validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # UI
    "streamlit>=1.40.0",
    # HTTP client
    "httpx>=0.27.0",
    # Google Gemini
    "google-genai>=1.0.0",
    # Data / numerics
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    # Markdown parsing
    "markdown-it-py>=3.0.0",
    "PyYAML>=6.0.2",
    # Utilities
    "tenacity>=9.0.0",
    "tqdm>=4.67.0",
    "rich>=13.9.0",
    "diskcache>=5.6.0",
    "datasets>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/DevRitesh08/Hybrid-Search-RAG"
Repository = "https://github.com/DevRitesh08/Hybrid-Search-RAG.git"
Issues = "https://github.com/DevRitesh08/Hybrid-Search-RAG/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
    "httpx>=0.27.0",
]
openai = [
    "openai>=1.55.0",
]

[project.scripts]
hybrid-rag = "hybrid_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["hybrid_rag"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/hybrid_rag"]
omit = ["*/tests/*"]
